<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose · claude-select</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f2; --surface: #fff; --ink: #1c1b19; --muted: #6b6860; --line: #dedbd3;
    --accent: #c2410c; --accent-soft: #fdeee6; --ok: #15803d; --warn: #b45309;
    --on-accent: #fff; --radius: 12px; --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 4px 16px rgb(0 0 0 / .04);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151412; --surface: #1f1e1b; --ink: #ecebe7; --muted: #a09c92; --line: #34322d;
            --accent: #fb923c; --on-accent: #1c1b19; --accent-soft: #3a2415; --ok: #4ade80; --warn: #fbbf24; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
           background: var(--surface); color: var(--ink); padding: .5rem .9rem; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
  svg { display: block; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }

  header.top { max-width: 80rem; margin: 0 auto; padding: 2rem 1.5rem 1rem; display: flex; gap: 1rem;
               align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 .25rem; letter-spacing: -.01em; }
  .desc { color: var(--muted); margin: 0; max-width: 60ch; white-space: pre-wrap; }
  .meta-row { display: flex; gap: .75rem; align-items: center; color: var(--muted); font-size: .85rem;
              font-variant-numeric: tabular-nums; }
  .late #timer { color: var(--warn); font-weight: 600; }
  .dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--ok); display: inline-block; }
  .offline .dot { background: var(--warn); animation: pulse 1s infinite alternate; }
  @keyframes pulse { to { opacity: .3; } }

  main { max-width: 80rem; margin: 0 auto; padding: 0 1.5rem calc(var(--bar-h, 9rem) + 1.5rem); display: grid; gap: 1rem;
         grid-template-columns: repeat(auto-fill, minmax(min(18rem, 100%), 1fr)); align-items: start; }
  @media (min-width: 44rem) { .card[data-type="long_text"] { grid-column: span 2; } }

  .card { position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius);
          box-shadow: var(--shadow); padding: .9rem; display: flex; flex-direction: column; gap: .6rem;
          cursor: pointer; transition: border-color .12s; }
  .card:hover { border-color: var(--muted); }
  .card:has(input:checked) { border-color: var(--accent); background: linear-gradient(var(--accent-soft), var(--surface) 5rem); }
  .card .head { display: flex; align-items: center; gap: .5rem; }
  .card label { display: flex; align-items: center; gap: .5rem; font-weight: 600; cursor: pointer; flex: 1; min-width: 0; }
  .card label span { overflow-wrap: anywhere; }
  .card input { accent-color: var(--accent); width: 1.1rem; height: 1.1rem; margin: 0; flex: none; }
  .again { display: flex; align-items: center; gap: .3rem; padding: .2rem .55rem; font-size: .8rem; color: var(--muted); }
  .again[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .card.redo { border-style: dashed; border-color: var(--accent); }
  .badge { font-size: .72rem; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 .45rem; }
  .check { position: absolute; top: -.6rem; right: -.6rem; width: 1.6rem; height: 1.6rem; border-radius: 50%;
           background: var(--accent); color: var(--on-accent); display: none; place-items: center; }
  .card:has(input:checked) .check { display: grid; }

  /* Checkerboard shows transparency in images; kept faint so letterboxing doesn't read as a glitch. */
  .frame { position: relative; border-radius: 8px; overflow: hidden;
           background: repeating-conic-gradient(color-mix(in srgb, var(--line) 45%, transparent) 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
  .frame img { display: block; width: 100%; height: 14rem; object-fit: contain; }
  .zoom { position: absolute; right: .5rem; bottom: .5rem; padding: .4rem; display: grid; place-items: center;
          background: color-mix(in srgb, var(--surface) 88%, transparent); cursor: zoom-in; }
  .short { margin: 0; font-size: 1.05rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .long { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 16rem; overflow: auto; padding: .75rem;
          border-radius: 8px; background: var(--bg); font-size: .93rem; line-height: 1.6;
          scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .long.open { max-height: none; }
  .more { align-self: flex-start; padding: .2rem .6rem; font-size: .82rem; }
  .meta { font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: .25rem .75rem; }
  .card.regen { cursor: progress; }
  .card.regen > :not(.head) { opacity: .35; filter: blur(1px); }
  .card.regen::after { content: "Regenerating…"; position: absolute; inset: 0; display: grid; place-items: center;
                       font-weight: 600; color: var(--accent); }
  .card.fresh { animation: fresh 1.2s ease-out; }
  @keyframes fresh { from { box-shadow: 0 0 0 4px var(--accent); } }

  footer.bar { position: fixed; inset: auto 0 0 0; background: color-mix(in srgb, var(--surface) 92%, transparent);
               backdrop-filter: blur(8px); border-top: 1px solid var(--line); }
  .bar-inner { max-width: 80rem; margin: 0 auto; padding: .8rem 1.5rem; display: flex; gap: .6rem;
               align-items: center; flex-wrap: wrap; }
  .count { color: var(--muted); font-size: .9rem; min-width: 8rem; font-variant-numeric: tabular-nums; }
  #feedback { flex: 1 1 16rem; font: inherit; padding: .5rem .7rem; border-radius: 8px; border: 1px solid var(--line);
              background: var(--bg); color: var(--ink); caret-color: var(--accent); }
  #feedback::placeholder { color: var(--muted); opacity: 1; }
  .banner { max-width: 80rem; margin: 0 auto; padding: .8rem 1.5rem 0; }
  .banner p { margin: 0; padding: .6rem .9rem; border-radius: 8px; background: var(--accent-soft); }
  .banner:empty { display: none; }
  /* Narrow: count + list actions, then the note, then the two decisions side by side. */
  @media (max-width: 40rem) {
    .count { flex: 1; min-width: 0; }
    #feedback { flex-basis: 100%; }
    #regen, #submit { flex: 1 1 auto; }
  }
  @media (pointer: coarse) { button, #feedback { min-height: 2.75rem; } .zoom { min-width: 2.75rem; } }

  dialog { border: 0; padding: 0; background: transparent; max-width: 95vw; max-height: 95vh; }
  dialog::backdrop { background: rgb(0 0 0 / .8); }
  dialog img { width: 90vw; height: 90vh; object-fit: contain; display: block; cursor: zoom-out; }
  @media (prefers-reduced-motion: reduce) { .offline .dot { animation: none; } }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1 id="title">Loading…</h1>
    <p class="desc" id="desc"></p>
  </div>
  <div class="meta-row" id="conn"><span class="dot"></span><span id="conn-text" aria-live="polite">Connected</span>
    <span id="timer"></span></div>
</header>
<main id="grid" aria-label="Options"></main>
<footer class="bar" id="bar">
  <!-- Status lives in the bar, next to the buttons that cause it, so it is never scrolled out of view. -->
  <div class="banner" id="banner" role="status" aria-live="polite"></div>
  <div class="bar-inner">
    <span class="count" id="count" aria-live="polite"></span>
    <button id="all" hidden>Select all</button>
    <button id="clear" hidden>Clear</button>
    <input id="feedback" type="text" placeholder="Optional note for the agent"
           aria-label="Note for the agent: what to change, or why you picked it" maxlength="2000">
    <button id="regen">Regenerate</button>
    <button id="submit" class="primary" title="Ctrl+Enter" aria-keyshortcuts="Control+Enter Meta+Enter">Submit selection</button>
  </div>
</footer>
<dialog id="viewer" aria-label="Full-size image"></dialog>

<script>
const token = new URLSearchParams(location.search).get('t') || '';
const $ = id => document.getElementById(id);
let S = null;            // last session snapshot from the server
let selected = new Set();  // winners, sent on submit
let redo = new Set();      // marked for another version, sent on regenerate
let sending = false;     // an event is in flight (possibly retrying)
let online = true;
let error = '';          // last refusal from the server, shown until the next send
const ICON_CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" stroke-width="3.5"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON_REDO = '<svg width="14" height="14" viewBox="0 0 24 24" stroke-width="2.25"><path d="M20 12a8 8 0 1 1-2.35-5.65L20 8.5M20 3.5v5h-5"/></svg>';
const ICON_ZOOM = '<svg width="16" height="16" viewBox="0 0 24 24" stroke-width="2"><path d="M15 4h5v5M9 20H4v-5M20 4l-6 6M4 20l6-6"/></svg>';

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'X-Select-Token': token, 'Content-Type': 'application/json' },
    body: body && JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.error || r.statusText), { status: r.status });
  return data;
}

const storeKey = () => 'claude-select:' + S.session_id;
function saveSel() {
  localStorage.setItem(storeKey(), JSON.stringify([...selected]));
  localStorage.setItem(storeKey() + ':redo', JSON.stringify([...redo]));
}

function setOnline(ok) {
  online = ok;
  $('conn').classList.toggle('offline', !ok);
  $('conn-text').textContent = ok ? 'Connected' : 'Connection lost, retrying…';
}

function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...kids.filter(k => k != null));
  return n;
}
// Assigning the same text still replaces the node, which makes screen readers repeat live regions.
function setText(n, s) { if (n.textContent !== s) n.textContent = s; }
const label = it => (it.metadata || {}).label || (it.metadata || {}).title || it.id;

function card(it, prevRev) {
  const type = S.mode === 'single' ? 'radio' : 'checkbox';
  const input = el('input', { type, name: 'pick', value: it.id, checked: selected.has(it.id), id: 'pick-' + it.id });
  input.addEventListener('change', () => {
    if (type === 'radio') selected = new Set([it.id]); else input.checked ? selected.add(it.id) : selected.delete(it.id);
    saveSel(); sync();
  });
  const md = it.metadata || {};
  const title = label(it);
  // Redo is its own toggle, so "keep this" and "make another version" never share one tick.
  const again = el('button', { className: 'again', type: 'button', ariaLabel: `Redo ${title}`, ariaPressed: 'false',
                               title: 'Ask the agent for a new version of this one', innerHTML: ICON_REDO + 'Redo' });
  again.addEventListener('click', () => { redo.has(it.id) ? redo.delete(it.id) : redo.add(it.id); saveSel(); sync(); });
  const head = el('div', { className: 'head' },
    el('label', { htmlFor: input.id }, input, el('span', { textContent: title })),
    it.revision > 1 ? el('span', { className: 'badge', textContent: 'v' + it.revision, title: 'Regenerated' }) : null, again);

  let body;
  if (it.type === 'image') {
    // The image itself selects, like the rest of the card; zoom has its own button.
    const img = el('img', { src: it.src, alt: md.alt || title, loading: 'lazy' });
    const zoom = el('button', { className: 'zoom', type: 'button', title: 'View full size',
                                ariaLabel: `View ${title} full size`, innerHTML: ICON_ZOOM });
    zoom.addEventListener('click', () => { $('viewer').replaceChildren(el('img', { src: it.src, alt: img.alt })); $('viewer').showModal(); });
    body = el('div', { className: 'frame' }, img, zoom);
    img.addEventListener('error', () => body.replaceWith(el('p', { className: 'short', textContent: 'Image failed to load.' })));
  } else if (it.type === 'short_text') {
    body = el('p', { className: 'short', textContent: it.content });
  } else {
    const box = el('div', { className: 'long', textContent: it.content, tabIndex: 0, role: 'region', ariaLabel: title });
    const more = el('button', { className: 'more', type: 'button', textContent: 'Expand' });
    more.addEventListener('click', () => { more.textContent = box.classList.toggle('open') ? 'Collapse' : 'Expand'; });
    body = el('div', {}, box);
    requestAnimationFrame(() => { if (box.scrollHeight <= box.clientHeight + 2) more.remove(); });
    body.append(more);
  }

  const words = it.content ? it.content.trim().split(/\s+/).length : 0;
  const extra = Object.entries(md).filter(([k]) => !['label', 'title', 'alt'].includes(k))
    .map(([k, v]) => el('span', { textContent: `${k}: ${typeof v === 'object' ? JSON.stringify(v) : v}` }));
  if (it.type === 'long_text') extra.push(el('span', { textContent: `${words.toLocaleString()} words` }));

  const c = el('article', { className: 'card' }, el('span', { className: 'check', innerHTML: ICON_CHECK, ariaHidden: 'true' }),
    head, body, extra.length ? el('div', { className: 'meta' }, ...extra) : null);
  c.dataset.type = it.type;
  c.dataset.id = it.id;
  if (prevRev && prevRev < it.revision) c.classList.add('fresh');
  // Whole card toggles, except clicks on its own controls or while selecting text.
  c.addEventListener('click', e => {
    if (e.target.closest('button, input, label, a') || getSelection().toString()) return;
    input.click();
  });
  return c;
}

function render(s) {
  const prev = S ? Object.fromEntries(S.items.map(i => [i.id, i.revision])) : {};
  const first = !S || S.session_id !== s.session_id;
  S = s;
  if (first) {
    selected = new Set(JSON.parse(localStorage.getItem(storeKey()) || '[]'));
    redo = new Set(JSON.parse(localStorage.getItem(storeKey() + ':redo') || '[]'));
  }
  const ids = new Set(s.items.map(i => i.id));
  selected = new Set([...selected].filter(id => ids.has(id)));
  redo = new Set([...redo].filter(id => ids.has(id)));
  if (s.mode === 'single' && selected.size > 1) selected = new Set([...selected].slice(0, 1));
  document.title = s.title + ' · claude-select';
  $('title').textContent = s.title;
  $('desc').textContent = s.description || '';
  $('grid').replaceChildren(...s.items.map(it => card(it, prev[it.id])));
  $('all').hidden = $('clear').hidden = s.mode !== 'multi';
  sync();
}

function sync() {
  const pending = new Set(S.pending);
  for (const c of document.querySelectorAll('.card')) {
    c.classList.toggle('regen', pending.has(c.dataset.id));
    c.ariaBusy = String(pending.has(c.dataset.id));
    c.querySelector('input').checked = selected.has(c.dataset.id);
    c.classList.toggle('redo', redo.has(c.dataset.id));
    c.querySelector('.again').ariaPressed = String(redo.has(c.dataset.id));
  }
  const open = S.status === 'open' && !pending.size && !sending;
  const n = selected.size;
  setText($('count'), (S.mode === 'single'
    ? (n ? '1 selected' : 'Pick one option')
    : `${n} of ${S.items.length} selected`) + (redo.size ? ` · ${redo.size} to redo` : ''));
  setText($('regen'), redo.size ? `Regenerate ${redo.size}` : 'Regenerate');
  $('regen').title = redo.size ? '' : 'Mark cards with Redo first';
  $('submit').disabled = !open || (S.mode === 'single' && n !== 1);
  $('regen').disabled = !open || !redo.size;
  $('all').disabled = !open || n === S.items.length;
  $('clear').disabled = !open || !n;
  for (const i of document.querySelectorAll('.card input, .card .again')) i.disabled = !open;
  const r = S.remaining_s;
  const late = S.status === 'open' && r < 300;
  const picked = S.items.filter(i => selected.has(i.id)).map(label).join(', ');
  const msg = sending ? (online ? 'Sending…' : 'Sending… the connection dropped; retrying until it is back.')
    : error && S.status === 'open' ? error
    : pending.size ? `The agent is regenerating ${pending.size} option${pending.size > 1 ? 's' : ''}. They update here automatically.`
    : S.status === 'submitted' ? `Sent: ${picked || 'none of the options'}. The agent has your choice; you can close this tab.`
    : S.status === 'expired' ? 'This selection timed out. Ask the agent in chat to reopen it.'
    : late ? 'Under 5 minutes left. Submit soon, or this selection times out.'
    : '';
  if ($('banner').textContent !== msg) $('banner').replaceChildren(...(msg ? [el('p', { textContent: msg })] : []));
  const left = r >= 3600 ? `${Math.floor(r / 3600)} h ${Math.floor(r % 3600 / 60)} min`
    : `${Math.floor(r / 60)}:${String(r % 60).padStart(2, '0')}`;
  setText($('timer'), S.status === 'open' ? `· ${left} left` : '');
  $('conn').classList.toggle('late', late);
}

async function send(action) {
  const ev = { client_event_id: crypto.randomUUID(), action,
               selected_ids: [...(action === 'regenerate' ? redo : selected)],
               feedback: $('feedback').value };
  sending = true; error = ''; sync();
  // Retry with the same client_event_id until the server answers; it drops duplicates.
  for (;;) {
    try {
      const r = await api('/api/event', ev);
      setOnline(true);
      S.status = r.status;
      if (action === 'regenerate') { S.pending = ev.selected_ids; redo.clear(); saveSel(); }
      $('feedback').value = '';
      break;
    } catch (e) {
      if (e.status) { error = `Could not send (${e.message}). The page refreshes its state; try again.`; break; }  // server said no; don't retry
      setOnline(false); sync();
      await new Promise(r => setTimeout(r, 2000));
    }
  }
  sending = false; sync();
}

$('submit').addEventListener('click', () => {
  if (!selected.size && !confirm('Submit with nothing selected? This tells the agent none of the options work.')) return;
  send('submit');
});
$('regen').addEventListener('click', () => send('regenerate'));
$('all').addEventListener('click', () => { selected = new Set(S.items.map(i => i.id)); saveSel(); sync(); });
$('clear').addEventListener('click', () => { selected.clear(); saveSel(); sync(); });
$('viewer').addEventListener('click', () => $('viewer').close());
addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !$('submit').disabled) { e.preventDefault(); $('submit').click(); }
});
// Keep the last card clear of the fixed bar, whose height changes as it wraps and shows status.
new ResizeObserver(() => document.body.style.setProperty('--bar-h', $('bar').offsetHeight + 'px')).observe($('bar'));

async function refresh() {
  try {
    const s = await api('/api/session');
    setOnline(true);
    if (!S || s.version !== S.version || s.session_id !== S.session_id) render(s);
    else { Object.assign(S, { status: s.status, pending: s.pending, remaining_s: s.remaining_s }); sync(); }
  } catch (e) {
    setOnline(false);
    if (e.status === 401) {  // token no longer valid: lock the page rather than let picks go nowhere
      $('title').textContent = 'This link has expired. Ask the agent for a new one.';
      $('conn-text').textContent = 'Disconnected';
      if (S) { S.status = 'expired'; sync(); }
      return;
    }
  }
  setTimeout(refresh, 2000);
}
refresh();
</script>
</body>
</html>
